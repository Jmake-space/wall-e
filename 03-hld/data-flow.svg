    <line x1="645" y1="452" x2="417" y2="452" stroke="#6B7280" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrG)"/>
    <circle cx="627" cy="452" r="10" fill="#6B7280" stroke="none"/><text x="627" y="456" font-size="10" font-weight="700" fill="#FFFFFF" stroke="none">10</text>
    <text x="530" y="444" fill="#4B5563">verifiable · clean</text>
    <!-- 11 -->
    <line x1="415" y1="494" x2="973" y2="494" stroke="#374151" stroke-width="1.8" marker-end="url(#arr)"/>
    <circle cx="433" cy="494" r="10" fill="#111827" stroke="none"/><text x="433" y="498" font-size="10" font-weight="700" fill="#FFFFFF" stroke="none">11</text>
