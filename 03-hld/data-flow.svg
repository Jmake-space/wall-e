    <line x1="415" y1="284" x2="528" y2="284" stroke="#374151" stroke-width="1.8" marker-end="url(#arr)"/>
    <circle cx="433" cy="284" r="10" fill="#111827" stroke="none"/><text x="433" y="288" font-size="10" font-weight="700" fill="#FFFFFF" stroke="none">5</text>
    <text x="472" y="276">balances + 30-day history</text>
    <!-- 6 -->
    <line x1="530" y1="312" x2="417" y2="312" stroke="#6B7280" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrG)"/>
    <circle cx="512" cy="312" r="10" fill="#6B7280" stroke="none"/><text x="512" y="316" font-size="10" font-weight="700" fill="#FFFFFF" stroke="none">6</text>
    <text x="472" y="304" fill="#4B5563">balances · recurring detected</text>
    <!-- 7 -->
    <line x1="415" y1="354" x2="758" y2="354" stroke="#374151" stroke-width="1.8" marker-end="url(#arr)"/>
    <circle cx="433" cy="354" r="10" fill="#111827" stroke="none"/><text x="433" y="358" font-size="10" font-weight="700" fill="#FFFFFF" stroke="none">7</text>
