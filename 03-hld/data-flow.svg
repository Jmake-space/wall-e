    <!-- 20 -->
    <line x1="70" y1="854" x2="183" y2="854" stroke="#374151" stroke-width="1.8" marker-end="url(#arr)"/>
    <circle cx="88" cy="854" r="10" fill="#111827" stroke="none"/><text x="88" y="858" font-size="10" font-weight="700" fill="#FFFFFF" stroke="none">20</text>
    <text x="128" y="846">approved</text>
    <!-- 21 -->
    <line x1="185" y1="882" x2="413" y2="882" stroke="#374151" stroke-width="1.8" marker-end="url(#arr)"/>
    <circle cx="203" cy="882" r="10" fill="#111827" stroke="none"/><text x="203" y="886" font-size="10" font-weight="700" fill="#FFFFFF" stroke="none">21</text>
    <text x="300" y="874">approval (amount + recipient bound)</text>
    <!-- 22 -->
    <line x1="415" y1="924" x2="758" y2="924" stroke="#374151" stroke-width="1.8" marker-end="url(#arr)"/>
    <circle cx="433" cy="924" r="10" fill="#111827" stroke="none"/><text x="433" y="928" font-size="10" font-weight="700" fill="#FFFFFF" stroke="none">22</text>
    <text x="588" y="916">execute — re-verify amount + recipient</text>
    <!-- 23 -->
    <line x1="760" y1="952" x2="417" y2="952" stroke="#6B7280" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrG)"/>
    <circle cx="742" cy="952" r="10" fill="#6B7280" stroke="none"/><text x="742" y="956" font-size="10" font-weight="700" fill="#FFFFFF" stroke="none">23</text>
    <text x="588" y="944" fill="#4B5563">receipt</text>
    <!-- 24 -->
    <line x1="415" y1="994" x2="873" y2="994" stroke="#374151" stroke-width="1.8" marker-end="url(#arr)"/>
    <circle cx="433" cy="994" r="10" fill="#111827" stroke="none"/><text x="433" y="998" font-size="10" font-weight="700" fill="#FFFFFF" stroke="none">24</text>
    <text x="645" y="986">record decision + movement</text>
    <!-- 25 -->
    <line x1="415" y1="1036" x2="973" y2="1036" stroke="#374151" stroke-width="1.8" marker-end="url(#arr)"/>
    <circle cx="433" cy="1036" r="10" fill="#111827" stroke="none"/><text x="433" y="1040" font-size="10" font-weight="700" fill="#FFFFFF" stroke="none">25</text>
    <text x="695" y="1028">confirmation</text>
    <!-- 26 -->
    <line x1="975" y1="1064" x2="72" y2="1064" stroke="#6B7280" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrG)"/>
    <circle cx="957" cy="1064" r="10" fill="#6B7280" stroke="none"/><text x="957" y="1068" font-size="10" font-weight="700" fill="#FFFFFF" stroke="none">26</text>
    <text x="523" y="1056" fill="#4B5563">“Sent $100 SOL to Jaideep ✓”</text>
  </g>

  <text x="40" y="1120" font-size="12" fill="#6B7280">Solid = request / command · Dashed = response / notification · The approval gate (20–21) is the only path to execution.</text>
</svg>
