    <circle cx="203" cy="172" r="10" fill="#111827" stroke="none"/><text x="203" y="176" font-size="10" font-weight="700" fill="#FFFFFF" stroke="none">2</text>
    <text x="242" y="164">verify caller identity</text>
    <!-- 3 -->
    <line x1="300" y1="200" x2="187" y2="200" stroke="#6B7280" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrG)"/>
    <circle cx="282" cy="200" r="10" fill="#6B7280" stroke="none"/><text x="282" y="204" font-size="10" font-weight="700" fill="#FFFFFF" stroke="none">3</text>
    <text x="243" y="192" fill="#4B5563">identity OK</text>
    <!-- 4 -->
    <line x1="185" y1="242" x2="413" y2="242" stroke="#374151" stroke-width="1.8" marker-end="url(#arr)"/>
    <circle cx="203" cy="242" r="10" fill="#111827" stroke="none"/><text x="203" y="246" font-size="10" font-weight="700" fill="#FFFFFF" stroke="none">4</text>
