  <g stroke="#9CA3AF" stroke-width="1.2" stroke-dasharray="5 5">
    <line x1="70" y1="88" x2="70" y2="1092"/>
    <line x1="185" y1="88" x2="185" y2="1092"/>
    <line x1="300" y1="88" x2="300" y2="1092"/>
    <line x1="415" y1="88" x2="415" y2="1092"/>
    <line x1="530" y1="88" x2="530" y2="1092"/>
    <line x1="645" y1="88" x2="645" y2="1092"/>
    <line x1="760" y1="88" x2="760" y2="1092"/>
    <line x1="875" y1="88" x2="875" y2="1092"/>
    <line x1="975" y1="88" x2="975" y2="1092"/>
