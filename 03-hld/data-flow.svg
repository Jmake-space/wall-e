    <circle cx="433" cy="424" r="10" fill="#111827" stroke="none"/><text x="433" y="428" font-size="10" font-weight="700" fill="#FFFFFF" stroke="none">9</text>
    <text x="530" y="416">check recipient · amount · fraud</text>
