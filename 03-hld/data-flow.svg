<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="1130" viewBox="0 0 1060 1130" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
