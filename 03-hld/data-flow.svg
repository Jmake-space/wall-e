    <!-- 14 -->
    <line x1="760" y1="592" x2="417" y2="592" stroke="#6B7280" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrG)"/>
    <circle cx="742" cy="592" r="10" fill="#6B7280" stroke="none"/><text x="742" y="596" font-size="10" font-weight="700" fill="#FFFFFF" stroke="none">14</text>
