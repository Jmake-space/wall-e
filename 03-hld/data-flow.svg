    <rect x="137" y="44" width="96" height="36" rx="8" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="1.5"/><text x="185" y="67" fill="#1E3A8A">Gateway</text>
    <rect x="252" y="44" width="96" height="36" rx="8" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="1.5"/><text x="300" y="67" fill="#1E3A8A">Auth</text>
    <rect x="367" y="44" width="96" height="36" rx="8" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="1.5"/><text x="415" y="67" fill="#1E3A8A">Agent Core</text>
    <rect x="482" y="44" width="96" height="36" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/><text x="530" y="67" fill="#92400E">Plaid</text>
