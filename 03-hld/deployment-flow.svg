<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#374151"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#B91C1C"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1280" height="760" fill="#FFFFFF"/>
  <text x="40" y="46" font-size="22" font-weight="700" fill="#111827">Wall-E — Deployment flow</text>
  <text x="40" y="70" font-size="13" fill="#6B7280">Deploy targets reuse the architecture colors: blue = microservices, amber = serverless workers, green = registries / stores.</text>

  <!-- Legend -->
  <rect x="1010" y="18" width="230" height="108" rx="10" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.5"/>
  <text x="1028" y="42" font-size="13" font-weight="700" fill="#111827">Legend</text>
  <rect x="1028" y="54" width="18" height="14" rx="3" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="1.5"/>
  <text x="1054" y="66" font-size="12.5" fill="#1F2937">Microservice target</text>
  <rect x="1028" y="78" width="18" height="14" rx="3" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
  <text x="1054" y="90" font-size="12.5" fill="#1F2937">Serverless target</text>
  <rect x="1028" y="102" width="18" height="14" rx="3" fill="#F3F4F6" stroke="#4B5563" stroke-width="1.5"/>
  <text x="1054" y="114" font-size="12.5" fill="#1F2937">Pipeline step</text>

  <!-- Stage 1: source -->
  <rect x="40" y="140" width="170" height="64" rx="10" fill="#F3F4F6" stroke="#4B5563" stroke-width="2"/>
  <text x="125" y="167" font-size="14" font-weight="700" fill="#1F2937" text-anchor="middle">Developer</text>
  <text x="125" y="186" font-size="12" fill="#6B7280" text-anchor="middle">push / pull request</text>

  <rect x="250" y="140" width="240" height="64" rx="10" fill="#F3F4F6" stroke="#4B5563" stroke-width="2"/>
  <text x="370" y="167" font-size="14" font-weight="700" fill="#1F2937" text-anchor="middle">CI</text>
  <text x="370" y="186" font-size="12" fill="#6B7280" text-anchor="middle">lint · tests · payment-path · secrets</text>

  <rect x="530" y="140" width="230" height="64" rx="10" fill="#F3F4F6" stroke="#4B5563" stroke-width="2"/>
  <text x="645" y="167" font-size="14" font-weight="700" fill="#1F2937" text-anchor="middle">Review -> merge</text>
  <text x="645" y="186" font-size="12" fill="#6B7280" text-anchor="middle">human review, then main</text>

  <!-- Stage 2: build (split tracks) -->
  <rect x="250" y="290" width="250" height="64" rx="10" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/>
  <text x="375" y="317" font-size="14" font-weight="700" fill="#1E3A8A" text-anchor="middle">Build container images</text>
  <text x="375" y="336" font-size="12" fill="#3B82F6" text-anchor="middle">gateway · core · auth · audit writer</text>

  <rect x="250" y="410" width="250" height="64" rx="10" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
  <text x="375" y="437" font-size="14" font-weight="700" fill="#92400E" text-anchor="middle">Bundle serverless functions</text>
  <text x="375" y="456" font-size="12" fill="#B45309" text-anchor="middle">plaid · rails · guardrails · notifier</text>

  <rect x="560" y="290" width="220" height="64" rx="10" fill="#D1FAE5" stroke="#047857" stroke-width="2"/>
  <text x="670" y="317" font-size="14" font-weight="700" fill="#065F46" text-anchor="middle">Container registry</text>
  <text x="670" y="336" font-size="12" fill="#059669" text-anchor="middle">versioned images</text>

  <rect x="560" y="410" width="220" height="64" rx="10" fill="#D1FAE5" stroke="#047857" stroke-width="2"/>
  <text x="670" y="437" font-size="14" font-weight="700" fill="#065F46" text-anchor="middle">Function registry</text>
  <text x="670" y="456" font-size="12" fill="#059669" text-anchor="middle">versioned bundles</text>

  <!-- Stage 3: environments -->
  <rect x="840" y="350" width="230" height="64" rx="10" fill="#F3F4F6" stroke="#4B5563" stroke-width="2"/>
  <text x="955" y="377" font-size="14" font-weight="700" fill="#1F2937" text-anchor="middle">Deploy: dev -> staging</text>
  <text x="955" y="396" font-size="12" fill="#6B7280" text-anchor="middle">automatic on merge</text>

  <polygon points="1110,382 1150,350 1190,382 1150,414" fill="#F3F4F6" stroke="#4B5563" stroke-width="2"/>
  <text x="1150" y="378" font-size="12" font-weight="700" fill="#1F2937" text-anchor="middle">human</text>
  <text x="1150" y="394" font-size="12" fill="#6B7280" text-anchor="middle">approval</text>

  <rect x="840" y="480" width="230" height="64" rx="10" fill="#F3F4F6" stroke="#4B5563" stroke-width="2"/>
  <text x="955" y="507" font-size="14" font-weight="700" fill="#1F2937" text-anchor="middle">Deploy: production</text>
  <text x="955" y="526" font-size="12" fill="#6B7280" text-anchor="middle">only after approval</text>

  <!-- Stage 4: targets -->
  <rect x="250" y="600" width="290" height="64" rx="10" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/>
  <text x="395" y="627" font-size="14" font-weight="700" fill="#1E3A8A" text-anchor="middle">Microservices -> container platform</text>
  <text x="395" y="646" font-size="12" fill="#3B82F6" text-anchor="middle">rolling deploys · health checks</text>

  <rect x="590" y="600" width="310" height="64" rx="10" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
  <text x="745" y="627" font-size="14" font-weight="700" fill="#92400E" text-anchor="middle">Workers -> serverless platform</text>
  <text x="745" y="646" font-size="12" fill="#B45309" text-anchor="middle">versioned · instant rollback</text>

  <!-- Arrows -->
  <g stroke="#374151" stroke-width="1.8" fill="none">
    <line x1="210" y1="172" x2="248" y2="172" marker-end="url(#arr)"/>
    <line x1="490" y1="172" x2="528" y2="172" marker-end="url(#arr)"/>
    <!-- merge -> builds -->
    <polyline points="645,204 645,262 375,262 375,288" marker-end="url(#arr)"/>
    <polyline points="660,204 660,442 375,442 375,472" marker-end="url(#arr)"/>
    <!-- builds -> registries -->
    <line x1="500" y1="322" x2="558" y2="322" marker-end="url(#arr)"/>
    <line x1="500" y1="442" x2="558" y2="442" marker-end="url(#arr)"/>
    <!-- registries -> staging -->
    <polyline points="780,322 810,322 810,382 838,382" marker-end="url(#arr)"/>
    <polyline points="780,442 810,442 810,382 838,382" marker-end="url(#arr)"/>
    <!-- staging -> approval -> prod -->
    <line x1="1070" y1="382" x2="1108" y2="382" marker-end="url(#arr)"/>
    <polyline points="1150,414 1150,512 955,512 955,546" marker-end="url(#arr)"/>
    <!-- prod -> targets -->
    <polyline points="900,544 900,572 395,572 395,598" marker-end="url(#arr)"/>
    <polyline points="1010,544 1010,572 745,572 745,598" marker-end="url(#arr)"/>
  </g>
  <!-- rollback -->
  <g stroke="#B91C1C" stroke-width="1.8" fill="none">
    <line x1="880" y1="480" x2="880" y2="416" stroke-dasharray="6 4" marker-end="url(#arrR)"/>
  </g>
  <text x="892" y="452" font-size="11.5" fill="#B91C1C">rollback</text>

  <text x="40" y="716" font-size="12.5" fill="#6B7280">Every deploy writes an audit entry · payment paths need green CI + human review · production needs explicit approval · hosting platform still TBD (see ADR 0005).</text>
</svg>
