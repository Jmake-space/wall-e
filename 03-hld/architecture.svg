<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="780" viewBox="0 0 1280 780" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#374151"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6B7280"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1280" height="780" fill="#FFFFFF"/>

  <text x="40" y="46" font-size="22" font-weight="700" fill="#111827">Wall-E — System Architecture (MVP)</text>
  <text x="40" y="70" font-size="13" fill="#6B7280">Color = deploy shape. Rationale in 06-schedule-adr/adr/0005-microservice-serverless-split.md.</text>

  <!-- Legend -->
  <rect x="1010" y="18" width="230" height="132" rx="10" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.5"/>
  <text x="1028" y="42" font-size="13" font-weight="700" fill="#111827">Legend</text>
  <rect x="1028" y="54" width="18" height="14" rx="3" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="1.5"/>
  <text x="1054" y="66" font-size="12.5" fill="#1F2937">Microservice (container)</text>
  <rect x="1028" y="78" width="18" height="14" rx="3" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
  <text x="1054" y="90" font-size="12.5" fill="#1F2937">Serverless worker</text>
  <rect x="1028" y="102" width="18" height="14" rx="3" fill="#EDE9FE" stroke="#6D28D9" stroke-width="1.5"/>
  <text x="1054" y="114" font-size="12.5" fill="#1F2937">External integration</text>
  <rect x="1028" y="126" width="18" height="14" rx="3" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
  <text x="1054" y="138" font-size="12.5" fill="#1F2937">Data store</text>

  <!-- CLIENTS -->
  <text x="40" y="118" font-size="11.5" font-weight="700" fill="#9CA3AF" letter-spacing="1.5">CLIENTS</text>
  <rect x="40" y="128" width="250" height="64" rx="10" fill="#F3F4F6" stroke="#4B5563" stroke-width="2"/>
  <text x="165" y="155" font-size="14" font-weight="700" fill="#1F2937" text-anchor="middle">Human</text>
  <text x="165" y="174" font-size="12" fill="#6B7280" text-anchor="middle">chat / app</text>
  <rect x="320" y="128" width="300" height="64" rx="10" fill="#F3F4F6" stroke="#4B5563" stroke-width="2"/>
  <text x="470" y="155" font-size="14" font-weight="700" fill="#1F2937" text-anchor="middle">Agent client</text>
  <text x="470" y="174" font-size="12" fill="#6B7280" text-anchor="middle">“1800 number” API consumer</text>

  <!-- EDGE -->
  <text x="40" y="216" font-size="11.5" font-weight="700" fill="#9CA3AF" letter-spacing="1.5">EDGE</text>
  <rect x="140" y="226" width="340" height="60" rx="10" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/>
  <text x="310" y="250" font-size="14" font-weight="700" fill="#1E3A8A" text-anchor="middle">API Gateway</text>
  <text x="310" y="269" font-size="12" fill="#3B82F6" text-anchor="middle">routes · rate limits · request IDs</text>

  <!-- CORE -->
  <text x="40" y="310" font-size="11.5" font-weight="700" fill="#9CA3AF" letter-spacing="1.5">CORE SERVICES</text>
  <rect x="40" y="320" width="330" height="68" rx="10" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/>
  <text x="205" y="347" font-size="14" font-weight="700" fill="#1E3A8A" text-anchor="middle">Agent Core</text>
  <text x="205" y="366" font-size="12" fill="#3B82F6" text-anchor="middle">orchestrator — proposes, waits, executes</text>
  <rect x="400" y="320" width="250" height="68" rx="10" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/>
  <text x="525" y="347" font-size="14" font-weight="700" fill="#1E3A8A" text-anchor="middle">Auth + Identity</text>
  <text x="525" y="366" font-size="12" fill="#3B82F6" text-anchor="middle">MFA at MVP → 3FA / 4FA</text>
  <rect x="680" y="320" width="250" height="68" rx="10" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
  <text x="805" y="347" font-size="14" font-weight="700" fill="#92400E" text-anchor="middle">Guardrails</text>
  <text x="805" y="366" font-size="12" fill="#B45309" text-anchor="middle">policy + fraud checks per request</text>

  <!-- INTEGRATION -->
  <text x="40" y="412" font-size="11.5" font-weight="700" fill="#9CA3AF" letter-spacing="1.5">INTEGRATION WORKERS</text>
  <rect x="40" y="422" width="240" height="68" rx="10" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
  <text x="160" y="449" font-size="14" font-weight="700" fill="#92400E" text-anchor="middle">Plaid Connector</text>
  <text x="160" y="468" font-size="12" fill="#B45309" text-anchor="middle">bank data in / out</text>
  <rect x="310" y="422" width="400" height="68" rx="10" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
  <text x="510" y="449" font-size="14" font-weight="700" fill="#92400E" text-anchor="middle">Rail Adapters</text>
  <text x="510" y="468" font-size="12" fill="#B45309" text-anchor="middle">Zelle · Coinbase · Trustly · UPI-BHIM (TBD)</text>
  <rect x="740" y="422" width="190" height="68" rx="10" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
  <text x="835" y="449" font-size="14" font-weight="700" fill="#92400E" text-anchor="middle">Notifier</text>
  <text x="835" y="468" font-size="12" fill="#B45309" text-anchor="middle">approvals · confirmations</text>

  <!-- EXTERNAL -->
  <text x="40" y="514" font-size="11.5" font-weight="700" fill="#9CA3AF" letter-spacing="1.5">EXTERNAL RAILS</text>
  <rect x="40" y="524" width="170" height="60" rx="10" fill="#EDE9FE" stroke="#6D28D9" stroke-width="2"/>
  <text x="125" y="551" font-size="14" font-weight="700" fill="#4C1D95" text-anchor="middle">Plaid API</text>
  <text x="125" y="569" font-size="12" fill="#7C3AED" text-anchor="middle">tokens, never logins</text>
  <rect x="235" y="524" width="190" height="60" rx="10" fill="#EDE9FE" stroke="#6D28D9" stroke-width="2"/>
  <text x="330" y="551" font-size="14" font-weight="700" fill="#4C1D95" text-anchor="middle">Bank rails</text>
  <text x="330" y="569" font-size="12" fill="#7C3AED" text-anchor="middle">Zelle-style transfers</text>
  <rect x="450" y="524" width="160" height="60" rx="10" fill="#EDE9FE" stroke="#6D28D9" stroke-width="2"/>
  <text x="530" y="551" font-size="14" font-weight="700" fill="#4C1D95" text-anchor="middle">Coinbase</text>
  <text x="530" y="569" font-size="12" fill="#7C3AED" text-anchor="middle">SOL · USDC · staking</text>
  <rect x="635" y="524" width="150" height="60" rx="10" fill="#EDE9FE" stroke="#6D28D9" stroke-width="2"/>
  <text x="710" y="551" font-size="14" font-weight="700" fill="#4C1D95" text-anchor="middle">Trustly</text>
  <text x="710" y="569" font-size="12" fill="#7C3AED" text-anchor="middle">bank payments</text>

  <!-- DATA -->
  <text x="1010" y="310" font-size="11.5" font-weight="700" fill="#9CA3AF" letter-spacing="1.5">DATA</text>
  <rect x="1010" y="320" width="230" height="60" rx="10" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/>
  <text x="1125" y="345" font-size="14" font-weight="700" fill="#1E3A8A" text-anchor="middle">Audit Writer</text>
  <text x="1125" y="363" font-size="12" fill="#3B82F6" text-anchor="middle">append-only</text>
  <rect x="1010" y="396" width="230" height="60" rx="10" fill="#D1FAE5" stroke="#047857" stroke-width="2"/>
  <text x="1125" y="421" font-size="14" font-weight="700" fill="#065F46" text-anchor="middle">Audit Store</text>
  <text x="1125" y="439" font-size="12" fill="#059669" text-anchor="middle">tamper-evident</text>
  <rect x="1010" y="472" width="230" height="60" rx="10" fill="#D1FAE5" stroke="#047857" stroke-width="2"/>
  <text x="1125" y="497" font-size="14" font-weight="700" fill="#065F46" text-anchor="middle">Transaction Store</text>
  <text x="1125" y="515" font-size="12" fill="#059669" text-anchor="middle">12 months history</text>
  <rect x="1010" y="548" width="230" height="60" rx="10" fill="#D1FAE5" stroke="#047857" stroke-width="2"/>
  <text x="1125" y="573" font-size="14" font-weight="700" fill="#065F46" text-anchor="middle">Token Vault</text>
  <text x="1125" y="591" font-size="12" fill="#059669" text-anchor="middle">Plaid tokens only</text>

  <!-- Arrows -->
  <g stroke="#374151" stroke-width="1.8" fill="none">
    <!-- clients -> gateway -->
    <line x1="165" y1="192" x2="165" y2="224" marker-end="url(#arr)"/>
    <line x1="470" y1="192" x2="470" y2="224" marker-end="url(#arr)"/>
    <!-- gateway -> agent core -->
    <polyline points="310,286 310,304 205,304 205,318" marker-end="url(#arr)"/>
    <!-- agent core <-> auth -->
    <line x1="370" y1="348" x2="398" y2="348" marker-end="url(#arr)"/>
    <line x1="400" y1="362" x2="372" y2="362" marker-end="url(#arr)"/>
    <!-- agent core -> guardrails -->
    <line x1="650" y1="348" x2="678" y2="348" marker-end="url(#arr)"/>
    <line x1="680" y1="362" x2="652" y2="362" marker-end="url(#arr)"/>
    <!-- agent core -> plaid connector / rail adapters -->
    <polyline points="205,388 205,405 160,405 160,420" marker-end="url(#arr)"/>
    <polyline points="240,388 240,405 510,405 510,420" marker-end="url(#arr)"/>
    <!-- agent core -> notifier (routed below) -->
    <polyline points="300,388 300,505 835,505 835,492" marker-end="url(#arr)"/>
    <!-- notifier -> human (right side) -->
    <polyline points="930,456 985,456 985,96 165,96 165,126" marker-end="url(#arr)"/>
    <!-- plaid connector -> plaid api -->
    <polyline points="160,490 160,507 125,507 125,522" marker-end="url(#arr)"/>
    <!-- rail adapters -> external rails -->
    <line x1="330" y1="490" x2="330" y2="522" marker-end="url(#arr)"/>
    <line x1="530" y1="490" x2="530" y2="522" marker-end="url(#arr)"/>
    <line x1="710" y1="490" x2="710" y2="522" marker-end="url(#arr)"/>
    <!-- plaid connector -> token vault (bottom bus) -->
    <polyline points="200,490 200,640 1125,640 1125,610" marker-end="url(#arr)"/>
    <!-- agent core -> audit writer -> audit store -->
    <line x1="1125" y1="380" x2="1125" y2="394" marker-end="url(#arr)"/>
    <!-- agent core -> transaction store / audit store (bus lines) -->
    <polyline points="120,388 120,700 1125,700 1125,534" marker-end="url(#arr)"/>
    <polyline points="150,388 150,730 1125,730 1125,458" marker-end="url(#arr)"/>
  </g>

  <!-- Arrow labels -->
  <g font-size="11" fill="#4B5563">
    <text x="993" y="250">notifications</text>
    <text x="700" y="636">token read / write</text>
    <text x="640" y="512" text-anchor="middle">executes via</text>
    <text x="1160" y="700">audit events</text>
  </g>
</svg>
