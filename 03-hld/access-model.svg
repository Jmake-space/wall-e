<text x="40" y="818" font-size="12.5" fill="#4B5563">Separation of duties: the component that reads money (sa-plaid) cannot move it · the component that moves it (sa-rails) cannot read it ·</text>
<text x="40" y="840" font-size="12.5" fill="#4B5563">the component that decides (sa-core) can touch neither directly — it works through workers, and every step is audited.</text>
<text x="40" y="870" font-size="12.5" fill="#6B7280">Service-to-service: mutual TLS with short-lived SA tokens. Gateway checks human/agent identity on every request via Auth + Identity.</text>
